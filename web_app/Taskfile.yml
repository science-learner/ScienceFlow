version: '3'

vars:
  APP_NAME: "scienceflow_gui"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  build:frontend:
    summary: Builds only the frontend into frontend/dist (same artifact wails3 build embeds; no Wails CLI needed)
    dir: frontend
    cmds:
      - test -d node_modules || npm install
      - npm run build:dist

  serve:
    summary: Builds the production web service and starts it (server mode, one-click remote web UI)
    cmds:
      - task: common:build:server
      - cmd: ./{{.BIN_DIR}}/{{.APP_NAME}}-server.exe
        platforms: [windows]
      - cmd: ./{{.BIN_DIR}}/{{.APP_NAME}}-server
        platforms: [linux, darwin]

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  build:server:linux:
    summary: Cross-compiles the production server binary for Linux (any host)
    desc: |
      Runs the same frontend + bindings build as build:server (so the embedded
      UI is never stale), then cross-compiles a stripped linux/amd64 binary with
      -tags server,production. Server mode has no native GUI dependencies, so no
      cgo or Docker is required. Output: bin/scienceflow_gui-server-linux-amd64.

      Usage: wails3 task build:server:linux [LINUX_ARCH=arm64]
    vars:
      LINUX_ARCH: '{{.LINUX_ARCH | default "amd64"}}'
      SERVER_BUILD_FLAGS: '-tags server,production -trimpath -buildvcs=false -ldflags="-w -s"'
    deps:
      - task: common:build:frontend
        vars:
          DEV: 'false'
          OBFUSCATED: 'false'
          BUILD_FLAGS: '{{.SERVER_BUILD_FLAGS}}'
    cmds:
      - GOOS=linux GOARCH={{.LINUX_ARCH}} CGO_ENABLED=0 go build {{.SERVER_BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}-server-linux-{{.LINUX_ARCH}}" .

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
