[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scienceflow"
version = "0.2.0b6"
description = "An end-to-end autoresearch agent framework for long-horizon ML research, scientific discovery, and beyond"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The default install is the Light, CPU-only ScienceFlow control plane. The Full product
# profile and internal task/model profiles are extras so deployments that call an external
# OpenAI-compatible provider (including vLLM) do not need CUDA, PyTorch, MLEBench, or tests.
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "aiofiles>=23.0",
    "rich>=13.0",
    "click>=8.1",
    "dataclasses-json>=0.6.0",
    "openai>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "lazy-loader>=0.4",
    "inquirycraft[openai,tui]==0.9.0",
    # langchain→langsmith→requests→urllib3: the optional zstd in 2.12+ requires the full
    # backports.zstd (unrelated to installing dev only)
    "backports-zstd>=1.3",
    # tenacity loads tornadoweb when `import tornado` succeeds; a leftover empty tornado
    # namespace in site-packages would cause ImportError: gen
    "tornado>=6.4",
    # Deterministic local PDF reports without a browser or external command.
    "reportlab>=4.2,<5",
]

[project.urls]
Homepage = "https://github.com/science-learner/ScienceFlow"
Repository = "https://github.com/science-learner/ScienceFlow"
Documentation = "https://github.com/science-learner/ScienceFlow/tree/preview/docs"
Issues = "https://github.com/science-learner/ScienceFlow/issues"

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "catboost>=1.2",
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
gpu = [
    "numpy>=1.26",
    "tabpfn>=7.0",
    "torch>=2.11",
    "torchvision>=0.20",
    "pillow>=10.0",
    "torchaudio>=2.11.0,<2.12",
    "sentencepiece>=0.2",
    "timm>=1.0.3",
    "segmentation-models-pytorch>=0.3.4",
    "ultralytics>=8.0",
    "transformers>=4.40",
    "protobuf>=4.25",
    "tiktoken>=0.7",
    "librosa>=0.10",
    "muq",
    "opencv-python-headless>=4.8",
    "torchmetrics>=1.0",
    "termcolor>=2.0",
]
mlebench = [
    "mlebench",
    "pydicom>=2.4",
]
detection-2d = [
    "dicomsdl>=0.107",
    "ensemble-boxes>=1.0",
]
inquirycraft-mcp = [
    "inquirycraft[mcp]==0.9.0",
]
scientific-design = [
    "cloudpickle>=3.0",
    "sci-modeling-bench==0.10.0",
]
# Compatibility profile matching the historical all-in-one ScienceFlow environment.
full = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabpfn>=7.0",
    "catboost>=1.2",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.11",
    "torchvision>=0.20",
    "pillow>=10.0",
    "torchaudio>=2.11.0,<2.12",
    "sentencepiece>=0.2",
    "timm>=1.0.3",
    "segmentation-models-pytorch>=0.3.4",
    "ultralytics>=8.0",
    "transformers>=4.40",
    "protobuf>=4.25",
    "tiktoken>=0.7",
    "librosa>=0.10",
    "muq",
    "opencv-python-headless>=4.8",
    "torchmetrics>=1.0",
    "termcolor>=2.0",
    "mlebench",
    "pydicom>=2.4",
    "dicomsdl>=0.107",
    "ensemble-boxes>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

# InquiryCraft's exact version constraint documents and enforces the reviewed
# public host-extension API contract.
[tool.uv]
default-groups = []
# Removing the historical aggregate extra must not opportunistically upgrade packages
# shared with ScienceFlow. These are the baseline-tested versions formerly held by the
# lock and are also compatible with the retained MCP 1.x adapter.
constraint-dependencies = [
    "cryptography==46.0.5",
    "idna==3.11",
    "pyjwt==2.12.1",
    "python-multipart==0.0.22",
    "sse-starlette==3.3.3",
    "starlette==1.0.0",
    "uvicorn==0.42.0",
]

[tool.uv.sources]
mlebench = { git = "https://github.com/openai/mle-bench.git", rev = "507f92e1138bb6e40dac5c6ee7a6758e6424bf97" }
# PyTorch: the default PyPI build is +cu130, which needs a CUDA 13 driver; switch to cu128
# to match common 570/575 drivers (nvidia-smi shows CUDA 12.8)
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
scienceflow = "scienceflow.interfaces.cli:main"

[tool.setuptools]
# Keep editable builds bounded to the Python package. Repo-local workspaces can
# contain dataset symlinks; automatic package-data discovery may otherwise walk
# into external MLE-bench data during `uv run`.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["scienceflow*", "tasks*"]
exclude = [
    "workspace*",
    "doc*",
    "tests*",
    "parallel_logs*",
    "cache*",
]
namespaces = true

[tool.setuptools.package-data]
"scienceflow.interfaces.ui.web_monitor" = ["assets/*.html", "assets/*.css", "assets/*.js"]
"scienceflow.interfaces.ui" = ["assets/*.png", "assets/*.ico", "assets/*.svg"]
"tasks" = [
    "**/*.json",
    "**/*.md",
    "**/*.py",
    "**/*.yaml",
]
"scienceflow.foundation.config" = [
    "default.yaml",
    "sci_modeling_bench.yaml",
]
"scienceflow.foundation.config.profiles" = [
    "defaults/*.yaml",
    "defaults/lnr/*.yaml",
]
"scienceflow.agent.prompts" = [
    "*.md",
    "L0/*.md",
]
"scienceflow.research.solver.lnr.support.prompt_templates" = [
    "evaluation/*.md",
    "estra/*.md",
    "resources/*.md",
    "stage/*.md",
    "task/*/*.md",
]

[tool.setuptools.data-files]
"share/scienceflow/skills/data_processing" = ["skills/data_processing/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--ignore=tests/test_llm_ask.py",
    "--ignore=tests/test_llm_tool_call.py",
    "--ignore=tests/test_openai_parallel_tool_calls.py",
]
filterwarnings = [
    # jieba still uses pkg_resources (setuptools); not actionable in this repo.
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    # Third-party / extension noise during pretrained tests (not actionable here).
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated. Please switch to `torch.compile` or `torch.export`.:DeprecationWarning",
    "ignore:`torch.nn.utils.weight_norm` is deprecated in favor of `torch.nn.utils.parametrizations.weight_norm`.:FutureWarning",
]
markers = [
    "pretrained: end-to-end tests that load pretrained weights and run forward (may download; prefer GPU)",
    "mlebench: official MLEBench integration (install with the mlebench or full extra)",
]
