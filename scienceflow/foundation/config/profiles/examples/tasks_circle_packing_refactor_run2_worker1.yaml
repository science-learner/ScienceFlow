# Independent post-refactor repeat; settings match the worker=1 baseline.

max_concurrent: 1
time_limit: 1200
resume: false

lnr:
  max_steps: 500
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/foundation/config/default.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/refactor_circle_packing_run2_worker1
  evaluator:
    enabled: true
    backend: task_package
  gate:
    params:
      minimum_metric_validity: high

tasks:
  - exp_id: circle-packing
    run_id: refactor-run2-worker1
    input_data_dir: ./data/opt_solver/circle_packing
    time_limit: 1200
    cpu_list: "0-7"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 900
      num_workers: 1
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222
