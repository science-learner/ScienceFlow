# Compact multi-task LNR manifest with endpoint-pool examples.
# This is a manifest, not a Config YAML. It references a config through defaults.config.

max_concurrent: 2
time_limit: 45000
resume: true

# Model aliases and provider endpoints belong in ~/.config/scienceflow/models.json.
# Tasks may select aliases under agent.code.model_aliases and
# agent.feedback.model_aliases without copying API keys into this file.

defaults:
  config: scienceflow/foundation/config/profiles/examples/lnr_config_overlay_example.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/DATE_run/example_multi_task

lnr:
  wall_clock_budget_sec: 43200
  num_workers: 2

tasks:
  - exp_id: nomad2018-predict-transparent-conductors
    run_id: nomad2018-example
    input_data_dir: ./data/mlebench_all_data/nomad2018-predict-transparent-conductors/prepared/dataset_split/Deep
    cpu_list: "0-31"
    gpu_list: "0"

  - exp_id: tabular-playground-series-may-2022
    run_id: tabular-may2022-example
    input_data_dir: ./data/mlebench_all_data/tabular-playground-series-may-2022/prepared/dataset_split/Deep
    cpu_list: "32-63"
    gpu_list: ""

# Per-task endpoint overrides may be placed on a task item when needed:
#   api_key: sk-task-specific
#   base_url: https://gateway.example/v1
