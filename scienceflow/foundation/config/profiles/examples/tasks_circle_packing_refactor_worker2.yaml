# Post-refactor Circle Packing validation. Keep all task/search settings aligned
# with tasks_circle_packing_worker2_baseline.yaml; only run/workspace names are isolated.

max_concurrent: 1
time_limit: 1200
resume: false

lnr:
  max_steps: 500
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/foundation/config/default.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/refactor_circle_packing_worker2
  evaluator:
    enabled: true
    backend: task_package
  gate:
    params:
      minimum_metric_validity: high

tasks:
  - exp_id: circle-packing
    run_id: refactor-worker2
    input_data_dir: ./data/opt_solver/circle_packing
    time_limit: 1200
    cpu_list: "8-23"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 900
      num_workers: 2
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222
