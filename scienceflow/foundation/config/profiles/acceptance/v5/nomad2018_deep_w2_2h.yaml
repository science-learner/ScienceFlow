    run_id: product-nomad2018-deep-w2-2h-20260903-r1
    input_data_dir: /work/miing_data/mlebench_all_data/nomad2018-predict-transparent-conductors/prepared/dataset_split/Deep
    time_limit: 7800
    cpu_list: "16-31"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 7200
      num_workers: 2
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222
