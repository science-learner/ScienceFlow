# ScienceFlow V5 Agent Runtime acceptance: TFBind8, 2 workers, 1 hour.

max_concurrent: 1
time_limit: 4200
resume: false

lnr:
  max_steps: 500
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/foundation/config/sci_modeling_bench.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/v5_acceptance
  tool:
    scienceflow_bash_timeout_sec: 600
    scienceflow_bash_timeout_slow_sec: 600
  evaluator:
    enabled: true
    backend: task_package

tasks:
  - exp_id: sci-modeling-bench-tfbind8
    run_id: v5-tfbind8-w2-1h
    input_data_dir: ./cache/sci_modeling_bench/tfbind8/public
    time_limit: 4200
    cpu_list: "0-15"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 3600
      num_workers: 2
      omp_threads_cap: 4
      resource_gpu_pool: []
      seed: 2222
