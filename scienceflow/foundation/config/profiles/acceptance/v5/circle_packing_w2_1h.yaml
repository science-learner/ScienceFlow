# ScienceFlow V5 Agent Runtime acceptance: Circle Packing, 2 workers, 1 hour.

max_concurrent: 1
time_limit: 4200
resume: false

lnr:
  max_steps: 500
  resource_control_mode: resource_smart_policy

defaults:
  config: scienceflow/foundation/config/default.yaml
  phase: run
  type: lnr
  workspace_base: ./workspaces/v5_acceptance
  evaluator:
    enabled: true
    backend: task_package
  gate:
    params:
      minimum_metric_validity: high

tasks:
  - exp_id: circle-packing
    run_id: v5-circle-packing-w2-1h
    input_data_dir: ./data/opt_solver/circle_packing
    time_limit: 4200
    cpu_list: "0-15"
    gpu_list: cpu
    lnr:
      wall_clock_budget_sec: 3600
      num_workers: 2
      omp_threads_cap: 8
      resource_gpu_pool: []
      seed: 2222
