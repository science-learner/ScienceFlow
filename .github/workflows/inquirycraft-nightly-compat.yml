name: Published InquiryCraft Compatibility

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      inquirycraft_version:
        description: Published InquiryCraft version to verify
        required: false
        default: "0.9.0"

permissions:
  contents: read

jobs:
  latest-inquirycraft-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compatibility environment
        env:
          INQUIRYCRAFT_VERSION: ${{ inputs.inquirycraft_version || '0.9.0' }}
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx numpy tenacity lazy-loader pytest pytest-asyncio pyyaml
          python -m pip install --upgrade "inquirycraft[openai,tui]==${INQUIRYCRAFT_VERSION}"
          python -m pip install --no-deps -e .
      - name: Verify cross-layer contracts
        run: >-
          python -m pytest -q
          tests/test_inquirycraft_cli_composition.py
          tests/test_inquirycraft_dependency_boundary.py
          tests/test_llm_system_message_compat.py
          tests/test_workspace_contract_fixtures.py
      - name: Verify full deterministic runtime parity
        run: python tools/run_runtime_parity.py --suite full --jobs 4
