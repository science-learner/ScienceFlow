name: InquiryCraft Nightly Compatibility

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      inquirycraft_ref:
        description: InquiryCraft branch, tag, or commit to verify
        required: false
        default: main

permissions:
  contents: read

jobs:
  latest-inquirycraft-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout InquiryCraft candidate
        uses: actions/checkout@v4
        with:
          repository: EE-PandaMinG/InquiryCraft
          ref: ${{ inputs.inquirycraft_ref || 'main' }}
          path: .deps/InquiryCraft
          token: ${{ secrets.INQUIRYCRAFT_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compatibility environment
        run: |
          python -m pip install -e . numpy pytest pytest-asyncio
          python -m pip install -e '.deps/InquiryCraft[openai]'
      - name: Verify cross-layer contracts
        run: >-
          python -m pytest -q
          tests/test_inquirycraft_cli_composition.py
          tests/test_inquirycraft_dependency_boundary.py
          tests/test_llm_system_message_compat.py
          tests/test_workspace_contract_fixtures.py
      - name: Verify full deterministic runtime parity
        run: python tests/support/run_runtime_parity.py --suite full --jobs 4
