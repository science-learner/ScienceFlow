<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" role="img" aria-labelledby="title description">
  <title id="title">ScienceFlow</title>
  <desc id="description">Making Long-Horizon Research Recoverable, Adaptive, and Efficient.</desc>
  <style>
    .wordmark { fill: #342b34; stroke: #342b34; }
    .flow { fill: #ce3d60; stroke: #ce3d60; }
    .supporting { fill: #545965; }
    .ivory { fill: #6f7780; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #fff1d6; stroke: #fff1d6; }
      .supporting { fill: #bfc2ca; }
      .ivory { fill: #fff1d6; }
    }
  </style>
  <defs>
    <g id="pixel-s">
      <rect x="10" width="40" height="10"/><rect y="10" width="10" height="20"/>
      <rect x="10" y="30" width="30" height="10"/><rect x="40" y="40" width="10" height="20"/>
      <rect y="60" width="40" height="10"/>
    </g>
    <g id="pixel-c">
      <rect x="10" width="40" height="10"/><rect y="10" width="10" height="50"/>
      <rect x="10" y="60" width="40" height="10"/>
    </g>
    <g id="pixel-i">
      <rect width="50" height="10"/><rect x="20" width="10" height="70"/>
      <rect y="60" width="50" height="10"/>
    </g>
    <g id="pixel-e">
      <rect x="10" width="40" height="10"/><rect y="10" width="10" height="50"/>
      <rect x="10" y="30" width="30" height="10"/><rect x="10" y="60" width="40" height="10"/>
    </g>
    <g id="pixel-n">
      <rect width="10" height="70"/><rect x="40" width="10" height="70"/>
      <rect x="10" y="10" width="10" height="20"/><rect x="20" y="30" width="10" height="10"/>
      <rect x="30" y="40" width="10" height="20"/>
    </g>
    <g id="pixel-f">
      <rect x="10" width="40" height="10"/><rect y="10" width="10" height="60"/>
      <rect x="10" y="30" width="30" height="10"/>
    </g>
    <g id="pixel-l">
      <rect width="10" height="60"/><rect x="10" y="60" width="40" height="10"/>
    </g>
    <g id="pixel-o">
      <rect x="10" width="30" height="10"/><rect y="10" width="10" height="50"/>
      <rect x="40" y="10" width="10" height="50"/><rect x="10" y="60" width="30" height="10"/>
    </g>
    <g id="pixel-w">
      <rect width="10" height="60"/><rect x="40" width="10" height="60"/>
      <rect x="20" y="30" width="10" height="30"/><rect x="10" y="60" width="10" height="10"/>
      <rect x="30" y="60" width="10" height="10"/>
    </g>
    <g id="science-wordmark">
      <use href="#pixel-s"/><use href="#pixel-c" x="60"/><use href="#pixel-i" x="120"/>
      <use href="#pixel-e" x="180"/><use href="#pixel-n" x="240"/><use href="#pixel-c" x="300"/>
      <use href="#pixel-e" x="360"/>
    </g>
    <g id="flow-wordmark">
      <use href="#pixel-f"/><use href="#pixel-l" x="60"/><use href="#pixel-o" x="120"/>
      <use href="#pixel-w" x="180"/>
    </g>
  </defs>

  <!-- The TUI microscope silhouette in its original ruby and ivory palette. -->
  <g transform="translate(77 60) scale(1.35)" shape-rendering="crispEdges">
    <g class="ivory">
      <rect x="32" y="0" width="80" height="16"/>
      <rect x="16" y="112" width="80" height="16"/>
    </g>
    <g fill="#ce3d60">
      <rect x="112" y="0" width="16" height="16"/>
      <rect x="48" y="16" width="80" height="16"/>
      <rect x="32" y="32" width="64" height="16"/>
      <rect x="32" y="48" width="112" height="16"/>
      <rect x="16" y="64" width="64" height="16"/>
      <rect x="112" y="64" width="48" height="16"/>
      <rect x="16" y="80" width="32" height="16"/>
      <rect x="128" y="80" width="48" height="16"/>
      <rect x="128" y="96" width="48" height="16"/>
      <rect x="128" y="112" width="48" height="16"/>
      <rect x="32" y="128" width="32" height="16"/>
      <rect x="112" y="128" width="48" height="16"/>
      <rect x="32" y="144" width="112" height="16"/>
      <rect x="16" y="160" width="160" height="16"/>
    </g>
    <g class="ivory">
      <rect x="80" y="64" width="32" height="32"/>
    </g>
  </g>

  <g transform="translate(390 60) scale(1.75 1.25)" shape-rendering="crispEdges" stroke-width="8" stroke-linejoin="miter" paint-order="stroke fill">
    <use href="#science-wordmark" class="wordmark"/>
    <use href="#flow-wordmark" x="420" class="flow"/>
  </g>

  <g transform="translate(380 0) scale(0.89 1)" font-family="DejaVu Sans, Arial, sans-serif">
    <text y="252" font-size="33" font-weight="800" letter-spacing="0.2">
      <tspan class="supporting">Making Long-Horizon Research · </tspan>
      <tspan fill="#ce3d60">RECOVERABLE</tspan>
      <tspan class="supporting"> · </tspan>
      <tspan fill="#8c78b8">ADAPTIVE</tspan>
      <tspan class="supporting"> · </tspan>
      <tspan fill="#247b73">EFFICIENT</tspan>
    </text>
  </g>
</svg>
