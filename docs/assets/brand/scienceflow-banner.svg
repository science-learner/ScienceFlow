<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title description">
  <title id="title">ScienceFlow</title>
  <desc id="description">Making Long-Horizon Research Recoverable, Adaptive, and Efficient.</desc>
  <defs>
    <g id="pixel-s">
      <rect width="50" height="10"/><rect y="10" width="10" height="30"/>
      <rect y="30" width="50" height="10"/><rect x="40" y="30" width="10" height="40"/>
      <rect y="60" width="50" height="10"/>
    </g>
    <g id="pixel-c">
      <rect width="50" height="10"/><rect y="10" width="10" height="50"/>
      <rect y="60" width="50" height="10"/>
    </g>
    <g id="pixel-i">
      <rect width="50" height="10"/><rect x="20" width="10" height="70"/>
      <rect y="60" width="50" height="10"/>
    </g>
    <g id="pixel-e">
      <rect width="50" height="10"/><rect width="10" height="70"/>
      <rect y="30" width="40" height="10"/><rect y="60" width="50" height="10"/>
    </g>
    <g id="pixel-n">
      <rect width="10" height="70"/><rect x="40" width="10" height="70"/>
      <rect x="10" y="10" width="10" height="20"/><rect x="20" y="30" width="10" height="10"/>
      <rect x="30" y="40" width="10" height="20"/>
    </g>
    <g id="pixel-f">
      <rect width="50" height="10"/><rect width="10" height="70"/>
      <rect y="30" width="40" height="10"/>
    </g>
    <g id="pixel-l">
      <rect width="10" height="70"/><rect y="60" width="50" height="10"/>
    </g>
    <g id="pixel-o">
      <rect x="10" width="30" height="10"/><rect y="10" width="10" height="50"/>
      <rect x="40" y="10" width="10" height="50"/><rect x="10" y="60" width="30" height="10"/>
    </g>
    <g id="pixel-w">
      <rect width="10" height="60"/><rect x="40" width="10" height="60"/>
      <rect x="20" y="30" width="10" height="30"/><rect x="10" y="60" width="10" height="10"/>
      <rect x="30" y="60" width="10" height="10"/>
    </g>
    <g id="scienceflow-wordmark">
      <use href="#pixel-s"/><use href="#pixel-c" x="60"/><use href="#pixel-i" x="120"/>
      <use href="#pixel-e" x="180"/><use href="#pixel-n" x="240"/><use href="#pixel-c" x="300"/>
      <use href="#pixel-e" x="360"/><use href="#pixel-f" x="420"/><use href="#pixel-l" x="480"/>
      <use href="#pixel-o" x="540"/><use href="#pixel-w" x="600"/>
    </g>
  </defs>

  <rect x="24" y="24" width="1552" height="372" rx="20" fill="#e8ddd0" stroke="#cbbcaf" stroke-width="4"/>

  <!-- The same 12x12 microscope used by the ScienceFlow TUI. -->
  <g transform="translate(82 76) scale(1.35)" shape-rendering="crispEdges">
    <g fill="#fff1d6">
      <rect x="48" y="0" width="16" height="16"/>
      <rect x="64" y="0" width="16" height="16"/>
      <rect x="80" y="0" width="16" height="16"/>
      <rect x="96" y="0" width="16" height="16"/>
      <rect x="16" y="112" width="16" height="16"/>
      <rect x="32" y="112" width="16" height="16"/>
      <rect x="48" y="112" width="16" height="16"/>
      <rect x="64" y="112" width="16" height="16"/>
      <rect x="80" y="112" width="16" height="16"/>
    </g>
    <g fill="#ce3d60">
      <rect x="48" y="16" width="64" height="16"/>
      <rect x="32" y="32" width="64" height="16"/>
      <rect x="32" y="48" width="112" height="16"/>
      <rect x="16" y="64" width="64" height="16"/>
      <rect x="112" y="64" width="48" height="16"/>
      <rect x="16" y="80" width="32" height="16"/>
      <rect x="128" y="80" width="48" height="16"/>
      <rect x="128" y="96" width="48" height="16"/>
      <rect x="128" y="112" width="48" height="16"/>
      <rect x="32" y="128" width="32" height="16"/>
      <rect x="112" y="128" width="48" height="16"/>
      <rect x="32" y="144" width="112" height="16"/>
      <rect x="16" y="160" width="160" height="16"/>
    </g>
    <g fill="#fff1d6">
      <rect x="80" y="64" width="32" height="16"/>
      <rect x="80" y="80" width="32" height="16"/>
    </g>
  </g>

  <g transform="translate(475 90)" shape-rendering="crispEdges">
    <use href="#scienceflow-wordmark" x="10" y="10" fill="#582b43"/>
    <use href="#scienceflow-wordmark" x="5" y="5" fill="#fff1d6"/>
    <use href="#scienceflow-wordmark" fill="#ce3d60"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="479" y="232" fill="#5f6670" font-size="34" font-weight="600" letter-spacing="1.5">Making Long-Horizon Research</text>
    <text x="479" y="292" font-size="34" font-weight="700" letter-spacing="1.5">
      <tspan fill="#ce3d60">Recoverable</tspan><tspan fill="#5f6670">, </tspan>
      <tspan fill="#725c9c">Adaptive</tspan><tspan fill="#5f6670">, and </tspan>
      <tspan fill="#247b73">Efficient</tspan>
    </text>
  </g>
</svg>
